services:
  postgres:
    image: postgres:17-alpine
    container_name: keeper-postgres
    environment:
      POSTGRES_DB: keeper_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - keeper_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d keeper_db"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  keeper_pgdata:
